name: phylum

services:
  server:
    container_name: phylum_server
    image: docker.io/shroff12/phylum:${PHYLUM_IMAGE_TAG:-latest}
    volumes:
      - ${DATA_ROOT:-./data}/${PHYLUM_DATA_LOCATION:-phylum}:/var/lib/phylum/
    env_file:
      - .env
    environment:
      PHYLUM_DB__HOST: db
      PHYLUM_DB__PORT: 5432
      PHYLUM_DB__NAME: ${PHYLUM_DB__NAME:-phylum}
      PHYLUM_DB__USER: ${PHYLUM_DB__USER:-phylum}
    ports:
      - '2448:2448'
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    container_name: phylum_db
    image: docker.io/postgres:17
    environment:
      POSTGRES_DB: ${PHYLUM_DB__NAME:-phylum}
      POSTGRES_USER: ${PHYLUM_DB__USER:-phylum}
      POSTGRES_PASSWORD: ${PHYLUM_DB__PASSWORD}
    volumes:
      - ${DATA_ROOT:-./data}/${PG_DATA_LOCATION:-postgres}:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always

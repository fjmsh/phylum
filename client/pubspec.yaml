name: phylum
description: Self-hosted cloud file browser
publish_to: "none"
version: 0.11.0+110

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  app_links:
  bloc:
  cached_network_image: ^4.0.0
  cached_network_image_platform_interface:
  collection:
  dbus:
  desktop_drop: ^0.8.4
  device_info_plus: ^13.2.0
  drift: ^2.35.3
  drift_flutter: ^0.3.0
  email_validator:
  file_picker: ^13.1.0
  flutter_bloc:
  flutter_launcher_icons:
  flutter_secure_storage:
  flutter_secure_storage_linux_secret_service:
  flutter_state_notifier:
  flutter_typeahead:
  background_downloader:
  hive_ce: ^2.10.0
  http:
  http_parser:
  intl:
  moment_dart:
  mime:
  offtheline:
    git:
      url: https://codeberg.org/shroff/offtheline.git
      ref: b3ee64a23db15f09fb7a495cd208077f443ebb52
  open_file:
  package_info_plus:
  path:
  path_provider:
  pasteboard:
  permission_handler:
  provider:
  receive_sharing_intent:
  share_plus:
  sqlite3:
  state_notifier:
  ua_parser:
  url_launcher:
  uri:
  web:
  window_manager:
  meta: ^1.15.0
  cross_file: ^0.3.4+2
  logging: ^1.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf

dependency_overrides:
  flutter_typeahead:
    git:
      url: https://github.com/shroff/flutter_typeahead.git
      ref: a58bd968060d2a79216854904aad255c0cfa95ae

flutter_launcher_icons:
  ios: true
  image_path: "assets/images/ic_launcher-playstore.png"
  image_path_ios_dark_transparent: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/ic_launcher-playstore.png"

hooks:
  user_defines:
    sqlite3:
      source:
        android: source
        default: sqlite3mc
      path: sqlite3/sqlite3mc.c # relative to your workspace root

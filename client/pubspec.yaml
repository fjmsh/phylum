name: phylum
description: Self-hosted cloud file browser
publish_to: "none"
version: 0.10.1+101

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  app_links:
  bloc:
  cached_network_image: ^4.0.0
  cached_network_image_platform_interface:
  collection:
  dbus:
  desktop_drop: ^0.8.4
  device_info_plus: ^13.2.0
  drift: 2.35.2
  drift_flutter: ^0.3.0
  email_validator:
  file_picker: ^13.1.0
  flutter_bloc:
  flutter_launcher_icons:
  flutter_state_notifier:
  flutter_typeahead:
  background_downloader:
  hive_ce: ^2.10.0
  http:
  http_parser:
  intl:
  moment_dart:
  mime:
  offtheline:
    git:
      url: https://codeberg.org/shroff/offtheline.git
      ref: a1cbdd397500faee79dd77066654e64da176fb05
  open_file:
  package_info_plus:
  path:
  path_provider:
  pasteboard:
  permission_handler:
  provider:
  receive_sharing_intent:
  share_plus:
  sqlite3:
  state_notifier:
  #super_clipboard: ^0.9.0
  #super_drag_and_drop:
  ua_parser:
  url_launcher:
  uri:
  web:
  window_manager:
  meta: ^1.15.0
  cross_file: ^0.3.4+2
  logging: ^1.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf

dependency_overrides:
  flutter_typeahead:
    git:
      url: https://github.com/shroff/flutter_typeahead.git
      ref: master
  drift:
    git:
      url: https://github.com/simolus3/drift.git
      ref: 14ab8bfb3340c406293610199801ea78e2a41b14
      path: drift

flutter_launcher_icons:
  ios: true
  image_path: "assets/images/ic_launcher-playstore.png"
  image_path_ios_dark_transparent: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/ic_launcher-playstore.png"

hooks:
  user_defines:
    sqlite3:
      source:
        android: source
        default: sqlite3
      path: sqlite3/sqlite3.c # relative to your workspace root

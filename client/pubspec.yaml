name: phylum
description: Self-hosted file storage
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.19.1+1
  drift_flutter: ^0.1.0
  file_selector: ^1.0.3
  flutter_state_notifier:
  go_router:
  hive:
  http:
  logger:
  mime:
  offtheline:
    git:
      url: https://codeberg.org/shroff/offtheline.git
      ref: 7e062f421d95e48234bfd040ba20714f11e8c509
  open_file:
  path:
  path_provider:
  provider:
  state_notifier:
  stream_transform:
  super_clipboard:
  uri:
  uuid:
  sqlite3: ^2.4.6
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
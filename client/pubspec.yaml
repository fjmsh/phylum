name: phylum
description: "Self-hosted file storage"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.19.1+1
  drift_flutter: ^0.1.0
  flutter_state_notifier:
  go_router:
  hive:
  http:
  offtheline:
    path: ../../offtheline
  state_notifier:
  path:
  path_provider:
  provider:
  uri:
  uuid:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
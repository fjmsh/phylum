name: phylum
description: Self-hosted file storage
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  collection:
  drift: ^2.19.1+1
  drift_flutter: ^0.2.1
  file_selector: ^1.0.3
  flutter_state_notifier:
  background_downloader:
  hive_ce: ^2.10.0
  http:
  http_parser: 
  intl:
  logger:
  mime:
  offtheline:
    git:
      url: https://codeberg.org/shroff/offtheline.git
      ref: 5e1be5e344cbe1c6a4ef242c25a6c9afa8f042f0
  open_file:
  path:
  path_provider:
  permission_handler:
  printing:
  provider:
  receive_sharing_intent:
  share_plus:
  sqlite3: 
  state_notifier:
  super_clipboard:
  super_drag_and_drop:
  uri:
  web:
  meta: ^1.15.0
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
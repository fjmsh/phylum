name: phylum
description: Self-hosted cloud file browser
publish_to: 'none'
version: 0.8.0+80

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface:
  circular_profile_avatar:
  collection:
  dbus:
  device_info_plus: ^11.5.0
  drift: ^2.19.1+1
  drift_flutter: ^0.3.0
  email_validator:
  file_picker: ^11.0.2
  flutter_launcher_icons:
  flutter_state_notifier:
  flutter_typeahead:
  background_downloader:
  hive_ce: ^2.10.0
  http:
  http_parser: 
  intl:
  moment_dart:
  mime:
  offtheline:
    git:
      url: https://codeberg.org/shroff/offtheline.git
      ref: 35980765e3c61963826884ad94cfd85cc35bbafc
  open_file:
  package_info_plus:
  path:
  path_provider:
  permission_handler:
  provider:
  receive_sharing_intent:
  share_plus:
  sqlite3:
  state_notifier:
  super_clipboard: ^0.9.0
  super_drag_and_drop:
  ua_parser:
  url_launcher:
  uri:
  web:
  window_manager:
  meta: ^1.15.0
  cross_file: ^0.3.4+2
  logging: ^1.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf


dependency_overrides:
  flutter_typeahead:
    git:
      url: https://github.com/shroff/flutter_typeahead.git
      ref: master

flutter_launcher_icons:
  ios: true
  image_path: "assets/images/ic_launcher-playstore.png"
  image_path_ios_dark_transparent: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/ic_launcher-playstore.png"

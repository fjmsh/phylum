name: phylum
description: Self-hosted file storage
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.19.1+1
  drift_flutter: ^0.2.1
  file_selector: ^1.0.3
  flutter_state_notifier:
  go_router:
  hive:
  http:
  http_parser: 
  intl:
  logger:
  mime:
  offtheline:
    git:
      url: https://codeberg.org/shroff/offtheline.git
      ref: d5e1879c76b780a1a78eb64fe5e03d6618d1b38d
  open_file:
  path:
  path_provider:
  provider:
  sqlite3: 
  state_notifier:
  stream_transform:
  super_clipboard:
  super_drag_and_drop:
  uri:
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.12
  
dependency_overrides:
  offtheline:
    path: ../../offtheline
  drift:
    path: ../../drift/drift
  drift_flutter:
    path: ../../drift/drift_flutter
  drift_sqflite:
    path: ../../drift/drift_sqflite

flutter:
  uses-material-design: true
<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Self-hosted file storage">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="phylum">

  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Phylum</title>
  <link rel="manifest" href="phylum.webmanifest">
  <style>
    body {
      background-color: #FBF9F5;
      margin: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121413;
      }
    }

    #app-loader {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out;
    }
  </style>
</head>

<body oncontextmenu="return false;">
  <div id="app-loader">
    <img src="icons/icon-192.png" alt="Phylum Logo" />
  </div>
  <script>
    const channel = new BroadcastChannel("the_one");
    var primary = true;

    channel.onmessage = (event) => {
      if (event.data == 'ping' && primary) {
        channel.postMessage('pong');
      }
      if (event.data == 'pong') {
        primary = false;
      }
    };
    channel.postMessage("ping");

    function setPrimary(value) {
      primary = value;
    }

    function isPrimary() {
      return primary;
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>

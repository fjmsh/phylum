{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style type="text/css">
table { border-collapse: collapse; }
.container { width: 100%; max-width: 600px; margin: 0 auto; }
.section { padding: 20px; }
.body { font-size: 16px; line-height: 1.6; color: #555555; }
.links { background-color: #769e57; color: #ffffff; }
@media screen and (max-width: 600px) { .container { width: 100% !important; padding: 10px !important; } .section { padding: 10px !important; } }
</style>
</head>
<body style="margin:0;padding:0;font-family:sans-serif">
<table width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
<table class="container" width="600" cellpadding="0" cellspacing="0">
<!-- Body -->
<tr><td class="section body">
Hi {{.name}},<br/><br/>
{{template "contents" .}}
<br/><br/>
Thank you,
</td></tr>
<!-- Links -->
<tr><td class="section links">
Download the Android app:<br/><br/>
<a href="https://codeberg.org/shroff/phylum/releases"><img src="https://get-it-on.codeberg.org/get-it-on-blue-on-white.png" height="48px" alt="Download from Codeberg"/></a>
</td></tr>
</table>
</td></tr></table>
</body>
</html>
{{end}}

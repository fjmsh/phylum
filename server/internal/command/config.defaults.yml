db:
  host: localhost
  port: 5432
  name: phylum
  user: phylum
  password: phylum    # Probably need to change this
  nomigrate: false    # Do not auto-migrate schema (dev)
  trace: false        # Trace queries (dev)

storage:
  root: storage
  temp: tmp           # relative to root, or absolute

core: 
  user:               # Config for new users
    basedir: /home
    permission: 0x10  # Invite users
  publinks:
    password:
      # hash is either argon2 or pbkdf2
      hash: pbkdf2
      pbkdf2: 
        function: sha-256
        iterations: 100000
        salt: 32
        key: 32

auth:
  auto_create:
    # - "*@example.com"
    # - "user@example.com"
    # - "user*@example.com"
  password:
    # backend is one of crypt, ldap, or none
    backend: crypt
    crypt:
      # hash is either argon2 or pbkdf2
      hash: argon2
      argon2: 
        memory: 18
        iterations: 4
        parallelism: 4
        salt: 32
        key: 32
      pbkdf2: 
        function: sha-256
        iterations: 1000000
        salt: 32
        key: 32
    requirements:
      length: 12
      lower: 1
      upper: 1
      numeric: 1
      symbols: 1
    ldap:
      debug: false
      url: ldap://ldap.example.com:1389
      starttls: false
      connect_timeout: 30s
      request_timeout: 30s
      # dn_template: cn={email},ou=people,dc=example,dc=com
      # search:
      #   bind_dn: cn=phylumbind,ou=people,dc=example,dc=com
      #   bind_password: ldap_password_for_phylumbind_user
      #   base_dn: dc=example,dc=com
      #   filter_template: (mail={email})
  # openid:
  #   clients:
  #     - id: google        # internal ID, prefer lower-kebab-case or lower_camel_case
  #       name: Google      # to be displayed to the user as 'Log In with <name>'
  #       issuer_url: https://accounts.google.com
  #       client_id:
  #       client_secret:

      
jobs: 
  workers: 5
  timeout: 0          # In seconds

server:
  host:
  port: 2448
  publinkpath: /pub
  webdav:
    enabled: true
    path: /webdav
  cors:
    enabled: false
    origins:
      - "*"

mail:
  smtp:
    host:
    port: 587
    username:
    password:
  from:
    name: Phylum Drive
    email:  phylum@example.com
  instance: https://phylum.example.com  # No trailing slash

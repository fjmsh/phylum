db:
  host: localhost
  port: 5432
  name: phylum
  user: phylum
  password: phylum    # Probably need to change this
  nomigrate: false    # Do not auto-migrate schema (dev)
  trace: false        # Trace queries (dev)

storage:
  location: storage
  
user:
  password:
    length: 12
    lower: 1
    upper: 1
    numeric: 1
    symbols: 1
  basedir: /home
  permission: 0x10    # Invite users

crypt:
  hash: argon2
  argon2: 
    memory: 2048
    iterations: 6
    parallelism: 4
    salt: 32
    key: 32

server:
  host:
  port: 2448
  publinkpath: /pub
  webdav:
    enabled: true
    path: /webdav
  cors:
    enabled: false
    origins:
      - "*"

mail:
  smtp:
    host:
    port: 587
    username:
    password:
  from:
    name: Phylum Drive
    email:  phylum@example.com
  instance: https://phylum.example.com  # No trailing slash

db:
  host: localhost
  port: 5432
  name: phylum
  user: phylum
  password: phylum    # Probably need to change this
  nomigrate: false    # Do not auto-migrate schema (dev)
  trace: false        # Trace queries (dev)

storage:
  root: storage
  temp: tmp           # relative to root, or absolute
  
user:
  password:
  basedir: /home
  permission: 0x10    # Invite users

auth:
  password:
    backend: crypt
    crypt:
      hash: argon2
      argon2: 
        memory: 2048
        iterations: 6
        parallelism: 4
        salt: 32
        key: 32
    requirements:
      length: 12
      lower: 1
      upper: 1
      numeric: 1
      symbols: 1
      
jobs: 
  workers: 5
  timeout: 0          # In seconds

server:
  host:
  port: 2448
  publinkpath: /pub
  webdav:
    enabled: true
    path: /webdav
  cors:
    enabled: false
    origins:
      - "*"

mail:
  smtp:
    host:
    port: 587
    username:
    password:
  from:
    name: Phylum Drive
    email:  phylum@example.com
  instance: https://phylum.example.com  # No trailing slash

version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "internal/core/db/migrations/data"
    gen:
      go:
        package: "db"
        out: "internal/core/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - column: "storage_backends.params"
            go_type:
              type: "map[string]string"